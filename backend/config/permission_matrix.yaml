# Role-based access matrix — keep in sync with app/core/permissions.py
roles:
  admin:
    - jobs:read
    - jobs:write
    - jobs:manage
    - applications:read
    - applications:write
    - applications:manage
    - profile:read
    - profile:write
    - bulk:upload
    - dashboard:recruiter
    - dashboard:seeker
    - dashboard:agency
    - dashboard:admin
    - users:read
    - users:manage
  recruiter:
    - jobs:read
    - jobs:write
    - jobs:manage
    - applications:read
    - applications:manage
    - dashboard:recruiter
  agency:
    - jobs:read
    - bulk:upload
    - applications:read
    - dashboard:agency
  job_seeker:
    - jobs:read
    - applications:read
    - applications:write
    - profile:read
    - profile:write
    - dashboard:seeker

route_access:
  /app/profile: [job_seeker]
  /app/applications: [job_seeker]
  /app/jobs/new: [recruiter]
  /app/jobs: [recruiter, admin]
  /app/jobs/*/applications: [recruiter, admin]
  /app/upload: [agency]
  /app/uploads: [agency]
  /app/admin/candidates: [admin]
  /app/admin/agency-uploads: [admin]
  /app/admin/users: [admin]
